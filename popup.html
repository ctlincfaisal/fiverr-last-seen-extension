<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Inbox Last Seen</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { width: 342px; min-height: 260px; margin: 0; color: #f5f8f7; background: #12191a; }
    .top { padding: 19px 20px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2a3734; }
    .app-icon { width: 38px; height: 38px; border-radius: 11px; background: #203b2e; display: grid; place-items: center; flex: none; }
    .app-icon img { width: 28px; height: 28px; object-fit: contain; }
    .heading { min-width: 0; flex: 1; }
    h1 { font-size: 15px; letter-spacing: -.2px; font-weight: 750; line-height: 1.3; margin: 0 0 3px; }
    .subtitle { font-size: 11px; line-height: 1.4; color: #9baea7; margin: 0; }
    .dot { width: 7px; height: 7px; background: #21bf70; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px #204532; }
    main { padding: 19px 20px 16px; }
    .state { display: flex; align-items: center; gap: 7px; color: #c5d5ce; font-size: 12px; line-height: 1.5; margin-bottom: 13px; }
    .state-icon { width: 7px; height: 7px; flex: none; border-radius: 50%; background: #889990; }
    .state-icon.success { background: #31d487; }
    .state-icon.error { background: #e7b56d; }
    .result { border: 1px solid #315344; background: linear-gradient(135deg,#1e392e,#172a25); border-radius: 13px; padding: 15px; }
    .eyebrow { color: #a9d8bf; font-size: 10px; font-weight: 720; letter-spacing: 1.1px; text-transform: uppercase; margin: 0 0 8px; }
    .date { font-size: 20px; line-height: 1.35; font-weight: 760; letter-spacing: -.3px; overflow-wrap: anywhere; }
    .relative { display: inline-flex; align-items: center; margin-top: 11px; font-size: 12px; font-weight: 670; background: #245c3f; color: #bdf4d3; border: 1px solid #367c54; border-radius: 99px; padding: 6px 10px; }
    .secondary { margin-top: 13px; color: #9daea8; font-size: 11px; line-height: 1.6; overflow-wrap: anywhere; }
    .help { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: #b4c7bb; }
    button { border: 1px solid #3b805d; background: #205a3b; color: #e8fff2; border-radius: 9px; padding: 8px 12px; font: inherit; font-size: 12px; font-weight: 650; margin-top: 12px; cursor: pointer; }
    button:hover { background: #2b744c; }
    button:focus-visible { outline: 2px solid #83eeb6; outline-offset: 3px; }
    footer { padding: 12px 20px 16px; border-top: 1px solid #283530; color: #8b9f95; font-size: 10px; display: flex; gap: 6px; align-items: center; }
    footer svg { width: 13px; height: 13px; flex: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="top">
    <div class="app-icon"><img src="icons/icon-48.png" alt=""></div>
    <div class="heading"><h1>Inbox Last Seen</h1><p class="subtitle">Activity viewer for Fiverr · Unofficial</p></div>
    <span class="dot" title="Local-only" aria-label="Local-only"></span>
  </header>
  <main>
    <div class="state" role="status" aria-live="polite"><span id="state-icon" class="state-icon"></span><span id="status">Checking current conversation…</span></div>
    <section id="result" class="result" hidden aria-label="Last seen information">
      <p class="eyebrow">Last active</p>
      <div id="date" class="date"></div>
      <div id="relative" class="relative"></div>
    </section>
    <p id="detail" class="secondary"></p>
    <p id="help" class="help" hidden></p>
    <button id="retry" hidden type="button">Check again</button>
  </main>
  <footer>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
    Local popup · No auto-reload · No extra requests
  </footer>
  <script src="popup.js"></script>
</body>
</html>
